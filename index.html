<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7d5b" />
  <title>IBS-koll</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>IBS-koll</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="today" role="tab">Idag</button>
      <button class="tab" data-tab="recipes" role="tab">Matlådor</button>
      <button class="tab" data-tab="settings" role="tab">Inställningar</button>
    </nav>
  </header>

  <main>
    <section id="view-today" class="view active"></section>
    <section id="view-recipes" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <footer class="disclaimer">
    Appen ersätter inte läkare eller dietist. Gränserna är ungefärliga riktvärden.
    Kolla Monash University FODMAP-appen för aktuella värden.
  </footer>

  <script src="foods.js"></script>
  <script src="recipes.js"></script>
  <script src="micro.js"></script>
  <script src="app.js"></script>
</body>
</html>
